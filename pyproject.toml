[project]
name = "simple-audio-server"
version = "0.1.0"
description = "A simple Flask audio server with pygame playback"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.6.1",
    "flask>=3.0.0",
]

[project.scripts]
simple_audio_server = "simple_audio_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simple_audio_server"]
